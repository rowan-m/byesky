# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    branches:
      - main
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci && npm run check && npm run build

      - name: Deploy to Firebase Hosting Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase_deploy
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BYE_SKY }}
          projectId: bye-sky

      - name: Inject Dynamic Preview URL into OAuth Metadata
        run: |
          node -e "
            const fs = require('fs');
            const urls = '${{ steps.firebase_deploy.outputs.urls }}'.trim().split(/[\s,]+/);
            const url = urls[0];
            if (url) {
              const file = 'dist/client-metadata.json';
              let content = fs.readFileSync(file, 'utf8');
              content = content.replace(/https:\/\/bye-sky\.web.app/g, url);
              fs.writeFileSync(file, content, 'utf8');
              console.log('Successfully injected preview URL:', url);
            } else {
              console.error('No preview URL found in action output!');
              process.exit(1);
            }
          "

      - name: Redeploy Updated Metadata to Same Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BYE_SKY }}
          projectId: bye-sky
